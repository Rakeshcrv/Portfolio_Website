name: Deploy Portfolio to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          timeout: 60s
          command_timeout: 30m

          script: |
            set -e

            echo "========================================"
            echo "🚀 Portfolio Deployment Started"
            echo "========================================"

            cd /home/ubuntu/Portfolio_Website

            echo "Fetching latest code..."

            git fetch origin
            git reset --hard origin/main

            echo "Creating .env..."

            cat > .env <<EOF
            VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
            VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
            VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
            EOF

            echo "Installing dependencies..."

            npm ci

            echo "Building project..."

            npm run build

            echo "Restarting service..."

            sudo systemctl restart portfolio

            echo "Waiting for service..."

            sleep 5

            echo "Checking service..."

            sudo systemctl is-active --quiet portfolio

            echo "Running health check..."

            curl --fail http://localhost:5173 >/dev/null

            echo "========================================"
            echo "✅ Deployment Successful"
            echo "========================================"

            echo "Node Version:"
            node -v

            echo "NPM Version:"
            npm -v

            echo "Website:"
            echo "https://rakeshsirvi.site"
